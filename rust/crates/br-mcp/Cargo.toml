[package]
name = "br-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"

[lib]
name = "br_mcp"
path = "src/lib.rs"

[[bin]]
name = "betterrecall-mcp"
path = "src/main.rs"

[dependencies]
br-contracts = { path = "../br-contracts" }
br-core = { path = "../br-core" }
br-integrity = { path = "../br-integrity" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
]
