[package]
name = "br-sign"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"

[[bin]]
name = "br-sign"
path = "src/main.rs"

[dependencies]
br-installer = { path = "../br-installer" }
br-integrity = { path = "../br-integrity" }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pem", "sha256", "std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1.0"
sha2 = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
br-contracts = { path = "../br-contracts" }
