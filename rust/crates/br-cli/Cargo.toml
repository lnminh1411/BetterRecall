[package]
name = "br-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "AGPL-3.0-only"

[lib]
name = "br_cli"
path = "src/lib.rs"

[[bin]]
name = "betterrecall"
path = "src/main.rs"

[dependencies]
br-contracts = { path = "../br-contracts" }
br-core = { path = "../br-core" }
br-integrity = { path = "../br-integrity" }
br-mcp-clients = { path = "../br-mcp-clients" }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Console",
]

[dev-dependencies]
tempfile = "3"
